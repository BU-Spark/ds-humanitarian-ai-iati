# fly.toml app configuration file generated for iati-atlas-george on 2026-11-19T13:13:03-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'iati-atlas-george'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  IATI_ASK_MODEL = 'anthropic/claude-sonnet-4-6'
  IATI_GRAPH_LABEL = 'benchmark snapshot'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
